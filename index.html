<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lipide – QR-Quiz</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f5f5;color:#222}.warning{background:#fff;color:#d00;font-weight:900;font-size:clamp(20px,4vw,32px);text-align:center;padding:18px 10px;border-bottom:4px solid #d00}.card{max-width:760px;margin:28px auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 3px 15px #0002}.badge{display:inline-block;padding:8px 14px;border-radius:999px;font-weight:bold}.small{color:#666;margin:8px 0 18px}.question{font-size:22px;font-weight:bold;line-height:1.35}.answers{display:grid;gap:12px;margin-top:22px}button{font-size:18px;padding:15px;border:2px solid #ddd;background:#fff;border-radius:12px;cursor:pointer;text-align:left}button:hover{background:#f0f0f0}button:disabled{cursor:default}.result{margin-top:20px;padding:18px;border-radius:14px;font-size:20px;font-weight:bold}.correct{background:#e8f5e9;border:2px solid #43a047}.wrong{background:#ffebee;border:2px solid #e53935}.hint{margin-top:15px;padding:18px;border:3px dashed #333;border-radius:14px;background:#fffde7}.hint strong{font-size:22px}</style></head><body><div class="warning">BITTE NICHT ENTFERNEN!! EIGENTUM DER HTL KREMS!!</div><div class="card" id="app"></div><script>const stations=[{"group": 1, "q": 1, "question": "Was ist die wichtigste Aufgabe von Lipiden im menschlichen Körper?", "answers": ["Energiespeicherung", "Aufbau von DNA", "Bildung von Sauerstoff", "Abbau von Proteinen"], "correct": 0, "color": "Rot", "hex": "#e53935", "nextColor": "Blau"}, {"group": 1, "q": 2, "question": "Wie viel Energie liefern Fette ungefähr pro Gramm?", "answers": ["2 kcal", "4 kcal", "9 kcal", "15 kcal"], "correct": 2, "color": "Blau", "hex": "#1e88e5", "nextColor": "Grün"}, {"group": 1, "q": 3, "question": "Aus welchen Elementen bestehen einfache Lipide laut Skript hauptsächlich?", "answers": ["C, H und O" : 0, "color": "Dunkelblau", "hex": "#3949ab", "nextColor": null}, {"group": 2, "q": 1, "question": "Wie sind gesättigte Fette bei Raumtemperatur häufig?", "answers": ["Fest", "Gasförmig", "Immer flüssig", "Immer gelartig"], "correct": 0, "color": "Lindgrün", "hex": "#7cb342", "nextColor": "Mint"}, {"group": 2, "q": 2, "question": "Wie sind ungesättigte Fette bei Raumtemperatur häufig?", "answers": ["Flüssig", "Immer fest", "Gasförmig", "Kristallin"], "correct": 0, "color": "Mint", "hex": "#26a69a", "nextColor": "Koralle"}, {"group": 2, "q": 3, "question": "Was bedeutet die Bezeichnung Omega-3 bei einer Fettsäure?", "answers": ["Die erste Doppelbindung liegt am dritten C-Atom vom Omega-Ende.", "Sie enthält genau drei Sauerstoffatome.", "Sie hat drei Fettsäuren.", "Sie enthält drei Glycerinmoleküle."], "correct": 0, "color": "Koralle", "hex": "#ff7043", "nextColor": "Gold"}, {"group": 2, "q": 4, "question": "Welche Omega-3-Fettsäure ist laut Skript essenziell?", "answers": ["ALA", "LA", "Cholesterin", "Glycerin"], "correct": 0, "color": "Gold", "hex": "#f9a825", "nextColor": "Silber"}, {"group": 2, "q": 5, "question": "Welche Omega-6-Fettsäure ist laut Skript essenziell?", "answers": ["LA", "ALA", "EPA", "DHA"], "correct": 0, "color": "Silber", "hex": "#9e9e9e", "nextColor": "Magenta"}, {"group": 2, "q": 6, "question": "Wie hoch sollte der Anteil der Energie aus Fett laut WHO-Vorgabe höchstens sein?", "answers": ["Unter 10 %", "Unter 20 %", "Unter 30 %", "Unter 50 %"], "correct": 2, "color": "Magenta", "hex": "#d81b60", "nextColor": "Violett"}, {"group": 2, "q": 7, "question": "Wie hoch sollte der Anteil gesättigter Fettsäuren laut WHO-Vorgabe sein?", "answers": ["Unter 1 %", "Unter 10 %", "Unter 30 %", "Unter 50 %"], "correct": 1, "color": "Violett", "hex": "#5e35b1", "nextColor": "Beige"}, {"group": 2, "q": 8, "question": "Wie hoch sollte der Anteil an Transfetten laut WHO-Vorgabe sein?", "answers": ["Unter 1 %", "Unter 5 %", "Unter 10 %", "Unter 20 %"], "correct": 0, "color": "Beige", "hex": "#d7b899", "nextColor": "Braun"}, {"group": 2, "q": 9, "question": "Was ist der Hauptbestandteil biologischer Zellmembranen unter den Lipiden?", "answers": ["Phospholipide", "Triglyceride", "Wachse", "Glycerin"], "correct": 0, "color": "Braun", "hex": "#6d4c41", "nextColor": "Schwarz"}, {"group": 2, "q": 10, "question": "Welche Eigenschaft beschreibt ein Phospholipid?", "answers": ["Hydrophiler Kopf und zwei hydrophobe Fettsäureschwänze", "Nur hydrophile Fettsäuren", "Drei hydrophile Schwänze", "Keine Fettsäuren"], "correct": 0, "color": "Schwarz", "hex": "#212121", "nextColor": null}, {"group": 3, "q": 1, "question": "Wie ordnen sich Phospholipide in einer Zellmembran an?", "answers": ["Zu einer Doppelschicht", "Zu einer Einfachschicht aus Proteinen", "Zu einem DNA-Strang", "Zu einzelnen Zuckerketten"], "correct": 0, "color": "Weiß", "hex": "#eeeeee", "nextColor": "Cyan"}, {"group": 3, "q": 2, "question": "Was bedeutet die selektive Durchlässigkeit der Zellmembran?", "answers": ["Bestimmte Stoffe können passieren, andere benötigen Membranproteine.", "Alle Stoffe können ungehindert passieren.", "Kein Stoff kann die Membran passieren.", "Nur Proteine können die Membran passieren."], "correct": 0, "color": "Cyan", "hex": "#00bcd4", "nextColor": "Petrol"}, {"group": 3, "q": 3, "question": "Welche Funktion hat Unterhautfettgewebe?", "answers": ["Es verringert den Wärmeverlust.", "Es bildet Peptidbindungen.", "Es transportiert Sauerstoff.", "Es baut DNA auf."], "correct": 0, "color": "Petrol", "hex": "#00695c", "nextColor": "Marineblau"}, {"group": 3, "q": 4, "question": "Welche zusätzliche Schutzfunktion haben Fettpolster?", "answers": ["Sie schützen Organe.", "Sie bilden Antikörper.", "Sie bauen Proteine ab.", "Sie bilden Sauerstoff."], "correct": 0, "color": "Marineblau", "hex": "#283593", "nextColor": "Bordeaux"}, {"group": 3, "q": 5, "question": "Woraus ist Cholesterin laut Skript eine Vorstufe?", "answers": ["Steroidhormone, Vitamin D und Gallensäuren", "Nur Triglyceride", "Nur Aminosäuren", "Nur Kohlenhydrate"], "correct": 0, "color": "Bordeaux", "hex": "#8e0000", "nextColor": "Lavendel"}, {"group": 3, "q": 6, "question": "Welche Aufgabe haben Gallensäuren bei der Fettverdauung?", "answers": ["Sie emulgieren Fette.", "Sie bilden Peptidbindungen.", "Sie speichern Sauerstoff.", "Sie bauen DNA auf."], "correct": 0, "color": "Lavendel", "hex": "#b39ddb", "nextColor": "Pfirsich"}, {"group": 3, "q": 7, "question": "Welche Vitamine sind fettlöslich?", "answers": ["A, D, E und K", "B und C", "Nur C", "B, C und K"], "correct": 0, "color": "Pfirsich", "hex": "#ffab91", "nextColor": "Oliv"}, {"group": 3, "q": 8, "question": "Warum eignen sich Triglyceride gut als Energiespeicher?", "answers": ["Sie werden nahezu wasserfrei gespeichert.", "Sie bestehen ausschließlich aus Wasser.", "Sie enthalten keine Kohlenstoffatome.", "Sie können keine Energie liefern."], "correct": 0, "color": "Oliv", "hex": "#827717", "nextColor": "Grau"}, {"group": 3, "q": 9, "question": "Was entsteht bei der Beta-Oxidation von Fettsäuren und kann anschließend zur ATP-Bildung beitragen?", "answers": ["Acetyl-CoA", "DNA", "Glycerin", "Phosphat"], "correct": 0, "color": "Grau", "hex": "#757575", "nextColor": "Limette"}, {"group": 3, "q": 10, "question": "Wie ist ein Phospholipid hinsichtlich seiner Wasserverträglichkeit aufgebaut?", "answers": ["Hydrophiler Kopf und hydrophobe Fettsäurereste", "Hydrophober Kopf und hydrophile Fettsäurereste", "Nur hydrophile Teile", "Nur hydrophobe Teile"], "correct": 0, "color": "Limette", "hex": "#c0ca33", "nextColor": null}];const p=new URLSearchParams(location.search),g=Number(p.get('g')),q=Number(p.get('q')),s=stations.find(x=>x.group===g&&x.q===q),app=document.getElementById('app');if(!s){app.innerHTML='<h1>QR-Code nicht gefunden</h1><p>Bitte den QR-Code noch einmal scannen.</p>'}else{let dark=['#e53935','#1e88e5','#43a047','#fb8c00','#ec407a','#8e24aa','#00b8a9','#3949ab','#26a69a','#ff7043','#d81b
